# 教育问数 Agent 的语义层配置。
# 表和字段用于 schema linking，指标用于统一统计口径。
tables:
  - name: dim_course
    role: dim
    description: 课程维度表，描述课程系列、课程分类和难度。
    columns:
      - name: course_id
        role: primary_key
        description: 课程唯一标识。
        alias: [课程ID, 课程编号]
        sync: false
      - name: course_name
        role: dimension
        description: 课程名称。
        alias: [课程, 课程名]
        sync: true
      - name: category
        role: dimension
        description: 课程分类，例如编程、数据分析和人工智能。
        alias: [课程类别, 类别, 方向]
        sync: true
      - name: level
        role: dimension
        description: 课程难度等级。
        alias: [难度, 难度等级]
        sync: true

  - name: dim_campus
    role: dim
    description: 校区维度表，描述校区名称和所在城市。
    columns:
      - name: campus_id
        role: primary_key
        description: 校区唯一标识。
        alias: [校区ID]
        sync: false
      - name: campus_name
        role: dimension
        description: 校区名称。
        alias: [校区, 校区名称]
        sync: true
      - name: city
        role: dimension
        description: 校区所在城市。
        alias: [城市, 所在城市]
        sync: true

  - name: dim_student
    role: dim
    description: 学员维度表，描述学员类型和基础属性。
    columns:
      - name: student_id
        role: primary_key
        description: 学员唯一标识。
        alias: [学员ID, 学生ID]
        sync: false
      - name: student_type
        role: dimension
        description: 学员类型，例如成人、学生和企业客户。
        alias: [学员类型, 用户类型]
        sync: true
      - name: gender
        role: dimension
        description: 学员性别。
        alias: [性别]
        sync: true
      - name: campus_id
        role: foreign_key
        description: 学员所属校区。
        alias: [校区ID]
        sync: false

  - name: fact_enrollment
    role: fact
    description: 报名事实表，记录报名、收入和学习完成情况。
    columns:
      - name: enrollment_id
        role: primary_key
        description: 报名记录唯一标识。
        alias: [报名ID, 报名记录]
        sync: false
      - name: student_id
        role: foreign_key
        description: 关联学员维度的外键。
        alias: [学员ID, 学生ID]
        sync: false
      - name: course_id
        role: foreign_key
        description: 关联课程维度的外键。
        alias: [课程ID]
        sync: false
      - name: campus_id
        role: foreign_key
        description: 关联校区维度的外键。
        alias: [校区ID]
        sync: false
      - name: enrollment_date
        role: dimension
        description: 报名日期。
        alias: [报名日期, 日期, 时间]
        sync: false
      - name: status_code
        role: dimension
        description: 报名状态，例如active、completed和refunded。
        alias: [报名状态, 状态]
        sync: true
      - name: amount
        role: measure
        description: 本次报名实付金额，单位为元。
        alias: [报名金额, 收入, 实付金额, 销售额]
        sync: false
      - name: completed_sessions
        role: measure
        description: 学员已完成的课次数。
        alias: [完成课次, 已完成课次]
        sync: false
      - name: total_sessions
        role: measure
        description: 报名课程总课次数。
        alias: [总课次, 课程课次]
        sync: false

metrics:
  - name: ENROLLMENT_COUNT
    description: 报名人数，按 COUNT(DISTINCT student_id) 统计，排除 status_code=refunded 的报名。
    relevant_columns: [fact_enrollment.enrollment_id]
    alias: [报名人数, 报名数, 报名数量, 学员报名数]
  - name: REVENUE
    description: 教育业务收入，按 SUM(amount) 统计，排除 status_code=refunded 的报名。
    relevant_columns: [fact_enrollment.amount]
    alias: [收入, 收入金额, 报名收入, 销售额]
  - name: COMPLETION_RATE
    description: 完课率，按 SUM(completed_sessions) / NULLIF(SUM(total_sessions), 0) 计算并转换为百分比，排除 status_code=refunded 的报名。
    relevant_columns: [fact_enrollment.completed_sessions, fact_enrollment.total_sessions]
    alias: [完课率, 完成率, 课程完成率]
