# 日志配置
logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 数据库meta的配置
db_meta:
  host: localhost
  port: 3307
  user: root
  password: "123456"
  database: meta

# 数据库dw的配置
db_dw:
  host: localhost
  port: 3307
  user: root
  password: "123456"
  database: dw_edu

# qdrant的配置
qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

# embedding的配置
embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

# es的配置
es:
  host: localhost
  port: 9200
  index_name: data_agent

# llm的配置
llm:
  provider: ${oc.env:LLM_PROVIDER,"deepseek"}
  model_name: ${oc.env:LLM_MODEL,"deepseek-chat"}
  api_key: ${oc.env:LLM_API_KEY,""}
  base_url: ${oc.env:LLM_BASE_URL,""}
